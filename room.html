<!DOCTYPE html>
<html lang="az">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TutkuMovie - Otaq</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .room-layout { display: flex; gap: 20px; max-width: 800px; margin: 0 auto; align-items: flex-start; }
    .main-content { flex: 2; text-align: center; }
    .chat-sidebar { flex: 1; background: #1f1f1f; border-radius: 10px; padding: 15px; height: 420px; display: flex; flex-direction: column; border: 1px solid #333; }
    .chat-messages { flex: 1; overflow-y: auto; text-align: left; margin-bottom: 10px; font-size: 14px; padding-right: 5px; }
    .chat-input-area { display: flex; gap: 5px; }
    .chat-input-area input { margin-bottom: 0; padding: 8px; font-size: 14px; }
    .chat-input-area button { width: 70px; padding: 8px; font-size: 14px; }
    
    /* Bekleme Ekranı (Loader) */
    #waiting-screen { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 350px; background: #1f1f1f; border-radius: 10px; }
    .spinner { border: 4px solid #333; border-top: 4px solid #e50914; border-radius: 50%; width: 50px; height: 50px; animation: spin 1s linear infinite; margin-bottom: 20px; }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="container" style="max-width: 850px;">
    <h1>🎬 TutkuMovie</h1>
    <div style="margin-bottom: 15px; font-size: 16px; color: #b3b3b3;">Otaq Kodu: <span id="display-room-code" style="color: #e50914; font-weight: bold;">---</span></div>

    <div class="room-layout">
      <!-- Sol Taraf: Film Seçim Alanı / Bekleme Ekranı -->
      <div class="main-content">
        <!-- Bekleme Ekranı -->
        <div id="waiting-screen">
          <div class="spinner"></div>
          <p>Yeni adam qoşulması gözlənilir...</p>
        </div>

        <!-- Film Kartı (Başta Gizli, Adam Qoşulanda Açılır) -->
        <div class="movie-card" id="movie-container" style="display: none; background: #2a2a2a; border-radius: 10px; padding-bottom: 15px;">
          <img id="movie-img" src="" alt="Film Afişi" style="width: 100%; height: 300px; object-fit: cover; border-top-left-radius: 10px; border-top-right-radius: 10px;">
          <h2 id="movie-title" style="margin-top: 15px; font-size: 18px;">Film Adı</h2>
          <div style="display: flex; gap: 10px; padding: 0 15px; margin-top: 15px;">
            <button id="dislike-btn" style="background-color: #333;">Bəyənmədim ❌</button>
            <button id="like-btn">Bəyəndim ❤️</button>
          </div>
        </div>
      </div>

      <!-- Sağ Taraf: Chat Paneli -->
      <div class="chat-sidebar">
        <h3 style="font-size: 16px; margin-bottom: 10px; color: #e50914; border-bottom: 1px solid #333; padding-bottom: 5px;">Otaq Sohbeti</h3>
        <div class="chat-messages" id="chat-messages">
          <div style="color: #777; font-style: italic;">Söhbətə başla...</div>
        </div>
        <div class="chat-input-area">
          <input type="text" id="chat-input" placeholder="Yaz...">
          <button id="send-btn">Göndər</button>
        </div>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
