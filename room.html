<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TutkuMovie - Oda</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .room-info { margin-bottom: 20px; font-size: 18px; color: #fff; }
    .movie-card { background: #2a2a2a; border-radius: 10px; overflow: hidden; padding-bottom: 15px; margin-bottom: 20px; }
    .movie-card img { width: 100%; height: 350px; object-fit: cover; }
    .buttons { display: flex; gap: 10px; padding: 0 15px; }
    .btn-dislike { background-color: #333 !important; }
    .btn-dislike:hover { background-color: #444 !important; }
  </style>
</head>
<body>
  <div class="container">
    <h1>🎬 TutkuMovie</h1>
    <div class="room-info">Oda Kodu: <span id="display-room-code" style="color: #e50914; font-weight: bold;">---</span></div>

    <div class="movie-card" id="movie-container">
      <img id="movie-img" src="" alt="Film Afişi">
      <h2 id="movie-title" style="margin-top: 15px; font-size: 20px;">Film Adı</h2>
      <div class="buttons" style="margin-top: 20px;">
        <button class="btn-dislike" id="dislike-btn">Beğenmedim ❌</button>
        <button id="like-btn">Beğendim ❤️</button>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
